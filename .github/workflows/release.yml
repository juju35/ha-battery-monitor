name: Release

# Publishes a GitHub release whenever main carries a version that has no tag yet:
# bump the version in manifest.json, const.py, the card and the panel, add its CHANGELOG.md section, push, and the release follows
# once Lint, Validate and HACS Validation pass on that commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  hacs:
    uses: ./.github/workflows/hacs.yml
    permissions:
      contents: read

  release:
    needs: [lint, validate, hacs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(jq -r .version custom_components/battery_monitor/manifest.json)"
          grep -q "VERSION: Final = \"$VERSION\"" custom_components/battery_monitor/const.py
          grep -q "BATTERY_MONITOR_CARD_VERSION = '$VERSION'" custom_components/battery_monitor/frontend/battery-monitor-card.js
          grep -q "BATTERY_MONITOR_PANEL_VERSION = '$VERSION'" custom_components/battery_monitor/frontend/battery-monitor-panel.js
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.version.outputs.exists == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Only English stays in the frontend files of the zip; each other language is its own file next to them,
      # fetched when needed (scripts/split-frontend.mjs). The repository keeps every language in the sources.
      - name: Split the translations
        if: steps.version.outputs.exists == 'false'
        run: |
          npm install --no-save --no-package-lock acorn@8.19.0
          node scripts/split-frontend.mjs

      - name: Build zip and notes
        if: steps.version.outputs.exists == 'false'
        run: |
          (cd custom_components/battery_monitor && zip -r ../../battery_monitor.zip . -x "__pycache__/*")
          .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" > notes.md
          test -s notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: battery_monitor.zip
          body_path: notes.md
          make_latest: true
