name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Latest Home Assistant: releases since 2026.3 need Python 3.14 (3.13 would resolve to 2026.2).
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements_test.txt

      - name: Home Assistant version
        run: python -c 'from homeassistant.const import __version__; print(f"::notice::Home Assistant {__version__}")'

      - name: Run tests
        run: pytest
        env:
          DEPRECATIONS_LOG: ${{ runner.temp }}/deprecations.log

      - name: Annotate deprecated calls
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/deprecations.log" ]; then
            sort -u "$RUNNER_TEMP/deprecations.log" | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done
          fi

  pytest-min-ha:
    name: Tests (minimum Home Assistant, 2024.12.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # 0.13.190 pins homeassistant==2024.12.0, the minimum in hacs.json, which pins this frontend.
      # Its cleanup check predates the shutdown thread of pycares 4.9+, which it would report as a leaked thread.
      - name: Install dependencies
        run: pip install pytest-homeassistant-custom-component==0.13.190 home-assistant-frontend==20241127.4 "pycares<4.9"

      - name: Run tests
        run: pytest

  card-tests:
    name: Card tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run card tests
        run: node --test test/*.test.mjs
