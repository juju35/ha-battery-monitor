name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  # Called by Release, so that a version is published only once these checks pass.
  workflow_call:

permissions:
  contents: read

# github.workflow is "Release" when called from Release: the group then stays distinct from this
# workflow's own push run on main, so neither cancels the other.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The checks the release makes, before merging: a version bumped in one file only fails the release on main.
      - name: Same version everywhere, and in the changelog
        run: |
          VERSION="$(jq -r .version custom_components/battery_monitor/manifest.json)"
          grep -q "VERSION: Final = \"$VERSION\"" custom_components/battery_monitor/const.py || { echo "::error file=custom_components/battery_monitor/const.py::version $VERSION not found in custom_components/battery_monitor/const.py"; exit 1; }
          grep -q "BATTERY_MONITOR_CARD_VERSION = '$VERSION'" custom_components/battery_monitor/frontend/battery-monitor-card.js || { echo "::error file=custom_components/battery_monitor/frontend/battery-monitor-card.js::version $VERSION not found in custom_components/battery_monitor/frontend/battery-monitor-card.js"; exit 1; }
          grep -q "BATTERY_MONITOR_PANEL_VERSION = '$VERSION'" custom_components/battery_monitor/frontend/battery-monitor-panel.js || { echo "::error file=custom_components/battery_monitor/frontend/battery-monitor-panel.js::version $VERSION not found in custom_components/battery_monitor/frontend/battery-monitor-panel.js"; exit 1; }
          grep -q "^## $VERSION " CHANGELOG.md || { echo "::error file=CHANGELOG.md::no '## $VERSION' entry in CHANGELOG.md"; exit 1; }
          echo "Version $VERSION everywhere"

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Latest Home Assistant: releases since 2026.3 need Python 3.14 (3.13 would resolve to 2026.2).
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements_test.txt

      - name: Home Assistant version
        run: python -c 'from homeassistant.const import __version__; print(f"::notice::Home Assistant {__version__}")'

      - name: Run tests
        run: pytest
        env:
          DEPRECATIONS_LOG: ${{ runner.temp }}/deprecations.log

      - name: Annotate deprecated calls
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/deprecations.log" ]; then
            sort -u "$RUNNER_TEMP/deprecations.log" | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done
          fi

  pytest-min-ha:
    name: Tests (minimum Home Assistant, 2024.12.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # 0.13.190 pins homeassistant==2024.12.0, the minimum in hacs.json, which pins this frontend.
      # Its cleanup check predates the shutdown thread of pycares 4.9+, which it would report as a leaked thread.
      - name: Install dependencies
        run: pip install pytest-homeassistant-custom-component==0.13.190 home-assistant-frontend==20241127.4 "pycares<4.9"

      - name: Run tests
        run: pytest

  screenshots-compare:
    name: Screenshot comparator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # The comparator decodes through ffmpeg; install it only if the runner lacks it, time-boxed and retried.
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          command -v ffmpeg > /dev/null && command -v ffprobe > /dev/null && exit 0
          for i in 1 2 3; do
            timeout 150 sudo apt-get update && timeout 300 sudo apt-get install -y --no-install-recommends ffmpeg && break
            echo "apt attempt $i failed or timed out, retrying in 15s"; sleep 15
          done
          ffmpeg -version > /dev/null

      - name: Install pytest
        run: pip install pytest

      # The screenshots script only rewrites a capture whose decoded pixels (every channel, every frame) changed.
      - name: Run comparator tests
        run: pytest scripts/tests

  card-tests:
    name: Card tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run card tests
        run: node --test test/*.test.mjs

  translation-split:
    name: Translation split
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Splits a copy of the frontend as the release does, and rebuilds every table to check it.
      - name: Check the translation split
        run: |
          npm install --no-save --no-package-lock acorn@8.19.0
          node scripts/split-frontend.mjs --check
